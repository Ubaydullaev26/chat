html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Nunito,'Noto Color Emoji',sans-serif;color:#3a1f2b}
#stage canvas{position:absolute;left:0;top:0}
#dip{position:absolute;inset:0;background:#fff3f7;opacity:0;pointer-events:none}
.cap{position:absolute;left:70px;right:70px;display:flex;justify-content:center;opacity:0}
.cap>div{background:#fff;border-radius:38px;padding:24px 38px;text-align:center;box-shadow:0 10px 0 rgba(160,40,80,.18),0 18px 40px rgba(60,10,30,.25)}
.big>div{font-weight:900;font-size:64px;line-height:1.12}
.sub>div{font-weight:800;font-size:46px;line-height:1.2;background:#fff7fa}
.cap b{color:#e8336f}
.tiny>div{font-weight:700;font-size:28px;line-height:1.25;background:rgba(255,255,255,.8);box-shadow:none;padding:12px 24px;color:#6d4a58}
.pill{position:absolute;left:0;right:0;display:flex;justify-content:center;opacity:0}
.pill>div{font-weight:900;font-size:54px;padding:20px 46px;border-radius:999px;color:#fff}
.card{position:absolute;display:flex;align-items:center;gap:22px;background:rgba(255,255,255,.96);border-radius:30px;padding:16px 26px;box-sizing:border-box;box-shadow:0 8px 0 rgba(160,40,80,.16),0 18px 34px rgba(80,20,50,.22);opacity:0;font-weight:800;font-size:42px;line-height:1.15}
.card .ic{font-size:58px;flex:none;width:86px;height:86px;border-radius:24px;display:flex;align-items:center;justify-content:center;background:#ffe3ec}
</style>
