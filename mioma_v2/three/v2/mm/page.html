html,body{margin:0;background:#111;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Nunito,'Noto Color Emoji',sans-serif}
canvas{display:block;width:1080px;height:1920px;position:absolute;left:0;top:0}
.ov{position:absolute;left:0;right:0;display:flex;justify-content:center;opacity:0}
.title>div{background:#fff;border-radius:40px;padding:22px 44px;font-weight:900;font-size:70px;color:#3a1f2b;box-shadow:0 10px 0 rgba(160,40,80,.25),0 18px 40px rgba(0,0,0,.25)}

.card .lab{font-weight:900;font-size:40px;letter-spacing:2px}
.card .txt{font-weight:900;font-size:58px;line-height:1.1;color:#2a1a22;margin-top:6px}
.card .stamp{position:absolute;right:-18px;top:-34px;font-size:96px;transform-origin:50% 50%}
.myth>div{border:8px solid #e53935}.myth .lab{color:#e53935}
.truth>div{border:8px solid #2fb36d}.truth .lab{color:#1e9a58}
.sub>div{max-width:920px;background:rgba(25,15,20,.72);border-radius:26px;padding:14px 26px;color:#fff;font-weight:800;font-size:40px;line-height:1.2;text-align:center}

.tiny>div{background:rgba(255,255,255,.85);border-radius:18px;padding:10px 22px;font-weight:700;font-size:28px;color:#5d4250;max-width:900px;text-align:center}
